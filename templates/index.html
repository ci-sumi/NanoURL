<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoUrl</title>
    <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
</head>

<body class="bg-purple-500 min-h-screen flex items-center justify-center">
    <div class="bg-yellow-200 shadow-lg rounded-2xl p-8 w-full max-w-md">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">
            Nano URL Shortner
        </h1>
        <form method="POST" class="flex items-center gap-4">
            <input type="text" name="url_sumi" 
            placeholder="Enter your long url" 
            class="w-full border border-gray-300
     rounded-xl px-4 py-3 focus:outline-none focus:ring-2
      focus:ring-blue-500 ">
            <div>
                <button type="submit"
                    class="bg-purple-600 hover:bg-blue-700
                     text-white font-semibold px-2 py-
                     rounded-xl transition duration-300">
                    Generate Short URL</button>
            </div>
        </form>
        {%if shorten_url %}
        <div class="mt-6 bg-gray-100 p-4 rounded-xl text-center">
            <p class="text-xl text-green-600 break-all">
                Your Generated code is :</p>
            <strong class="text-xl text-green-600 break-all">{{shorten_url}}
            </strong>
        </div>
        {% endif %}
    </div>
</body>

</html>
