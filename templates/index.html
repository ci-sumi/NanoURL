<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoUrl</title>
    <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">
</head>

<body class="bg-olive-800 min-h-screen">
    <header class="bg-gray-100 px-8 py-4 shadow-md">
        <nav class="flex  justify-end gap-4">
            <a href="#" class="hover:text-amber-300 transition duration-300 py-7">About</a>
        </nav>
    </header>
    <main class="flex justify-center items-center py-20 px-4">
        <div class="p-8 px-4 md:px-8 lg:px-10 bg-gray-100 rounded-lg shadow-lg w-full max-w-2xl">
            <div class="border border-l-8 border-blue-800 shadow rounded-lg mt-8 mb-8 p-6">
                <h5 class="text-3xl font-bold m-5">NanoURL</h5>
                <form action="/shorten" method="POST" class="flex items-center gap-4 justify-end">
                    <input type="url" name="url_sumi" placeholder="Enter your long url" class="w-full m-10 border border-gray-300
     px-5 py-3 focus:outline-none focus:ring-2
      focus:ring-blue-500 ">
                <div>
                    <button type="submit" class="bg-blue-800 hover:bg-blue-700
                     text-white font-semibold px-1 py-1 xl transition duration-300
                     hover:shadow-sm">
                        Generate Short URL</button>
                </div>
            </form>
            {%if error %}
            <div class="mt-6 bg-gray-100 p-4 rounded-xl text-center">
                <p class="text-xl text-red-600 break-all">
                    Error: {{ error }}
                </p>
            </div>
            {% endif %}
            {%if display_existing_url %}
            <div class="mt-6 bg-gray-100 p-4 rounded-xl text-center">
                <p class="text-xl text-black break-all">
                    Here's your short url. :</p>
                <strong class="text-xl text-black break-all" id="url-text">{{display_existing_url}}</strong>
                <div id="actions" class="flex justify-center mt-6 gap-4">
                <button onclick="handlecopy()" class="bg-blue-800 hover:bg-blue-700
                     text-white font-semibold px-1 py-1 xl transition duration-300
                     hover:shadow-sm">
                    Copy
                </button>
                <form action="{{ display_existing_url }}" target="_blank" method="GET" class="inline-block">
                    <button type="submit" class="bg-blue-800 hover:bg-blue-700
                     text-white font-semibold px-1 py-1 xl transition duration-300
                     hover:shadow-sm">
                        Visit the Site
                    </button>
                </form>
            </div>
            {% elif display_url %}
            <div class="mt-6 bg-gray-100 p-4 rounded-xl text-center">
                <p class="text-xl text-gre-600 break-all">
                    Your Generated code is :</p>
                <strong class="text-xl text-black-600 break-all" id="url-text">{{display_url}}</strong>
            </div>
            <div id="actions" class="flex justify-center mt-6 gap-4">
                <button onclick="handlecopy()" class="bg-purple-500 hover:bg-blue-400 text-white font-bold 
        py-2 px-4 border-b-4 border-blue-700 hover:border-blue-500 rounded">
                    Copy
                </button>
                <form action="{{ display_url }}" target="_blank" method="GET" class="inline-block">
                    <button type="submit" class="bg-purple-500 hover:bg-blue-400 text-white font-bold 
        py-2 px-4 border-b-4 border-blue-700 hover:border-blue-500 rounded">
                        Visit the Site
                    </button>
                </form>
            </div>
            {% endif %}

    </main>
</body>
<script>
    function handlecopy() {
        const urlText = document.getElementById('url-text').textContent;
        navigator.clipboard.writeText(urlText)
            .then(() => {
                alert('URL copied to clipboard!');
            })
            .catch(err => {
                console.error('Failed to copy: ', err);
            });
    }
</script>
</body>

</html>
